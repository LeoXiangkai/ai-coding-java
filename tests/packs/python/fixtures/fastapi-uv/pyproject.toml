[project]
name = "sample-fastapi"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.5",
  "sqlalchemy>=2",
  "alembic>=1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1"]

[tool.ruff]
line-length = 100
[tool.mypy]
strict = true
[tool.pytest.ini_options]
addopts = "-q"
