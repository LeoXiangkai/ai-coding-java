name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git identity
        run: |
          git config --global user.name aicj-ci
          git config --global user.email aicj-ci@example.invalid
          git config --global init.defaultBranch main
      - run: python -m pip install pytest
      - run: python -m pytest tests -q -p no:cacheprovider
      - run: python scripts/sanitize_check.py
      - run: python scripts/template_integrity_check.py
      - run: python scripts/install_roundtrip_check.py
      - name: Windows PowerShell 5.1 one-click install smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $selfTestHome = Join-Path $env:RUNNER_TEMP "aicj-home-powershell"
          $selfTestRepo = Join-Path $env:RUNNER_TEMP "aicj-repo-powershell"
          powershell -ExecutionPolicy Bypass -File scripts/windows/install.ps1 -Mode cc -NoPrereqs -NoClaude -RepoUrl $env:GITHUB_WORKSPACE -RepoDir $selfTestRepo -HomeDir $selfTestHome
      - name: Windows PowerShell 7 one-click install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cpaDir = Join-Path $env:RUNNER_TEMP "cliproxyapi"
          pwsh -File "$env:GITHUB_WORKSPACE/scripts/windows/install-cpa.ps1" -InstallDir $cpaDir -NoAutostart
          $key = (Get-Content (Join-Path $cpaDir "config.yaml") | Where-Object { $_ -match '^\s*-\s*([^\s#]+)' } | Select-Object -First 1) -replace '^\s*-\s*',''
          $selfTestHome = Join-Path $env:RUNNER_TEMP "aicj-home-pwsh"
          $selfTestRepo = Join-Path $env:RUNNER_TEMP "aicj-repo-pwsh"
          pwsh -File "$env:GITHUB_WORKSPACE/scripts/windows/install.ps1" -Mode worker -CpaToken $key -NoPrereqs -NoClaude -RepoUrl $env:GITHUB_WORKSPACE -RepoDir $selfTestRepo -HomeDir $selfTestHome
          pwsh -File "$env:GITHUB_WORKSPACE/scripts/windows/install.ps1" -Mode cc -NoPrereqs -NoClaude -RepoUrl $env:GITHUB_WORKSPACE -RepoDir $selfTestRepo -HomeDir $selfTestHome
          pwsh -File "$env:GITHUB_WORKSPACE/scripts/windows/install.ps1" -Mode cc -NoPrereqs -NoClaude -RepoUrl $env:GITHUB_WORKSPACE -RepoDir $selfTestRepo -HomeDir $selfTestHome
          $raw = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes("$env:GITHUB_WORKSPACE/scripts/windows/install.ps1")).TrimStart([char]0xFEFF)
          & ([scriptblock]::Create($raw)) -Mode cc -NoPrereqs -NoClaude -RepoUrl $env:GITHUB_WORKSPACE -RepoDir (Join-Path $env:RUNNER_TEMP "aicj-repo-iex") -HomeDir (Join-Path $env:RUNNER_TEMP "aicj-home-iex")
          if ($LASTEXITCODE -ne 0) { throw "iex smoke failed: $LASTEXITCODE" }
          Write-Host "session-alive"
          if ($LASTEXITCODE -ne 0) { throw "PowerShell session did not remain usable" }
          pwsh -File "$env:GITHUB_WORKSPACE/scripts/windows/install-cpa.ps1" -InstallDir $cpaDir -Uninstall -Purge

  wsl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3 python3-pytest git
      - name: Verify in WSL filesystem
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          git config --global user.name aicj-ci
          git config --global user.email aicj-ci@example.invalid
          git config --global init.defaultBranch main
          rm -rf ~/repo
          cp -r "$(wslpath -u '${{ github.workspace }}')" ~/repo
          git -C ~/repo config core.autocrlf false
          git -C ~/repo checkout -- .
          cd ~/repo
          python3 -m pytest tests -q -p no:cacheprovider
          python3 scripts/install_roundtrip_check.py
      - name: Verify Windows Python handoff from WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          windows_userprofile="$(cmd.exe /c echo %USERPROFILE% | tr -d '\r')"
          windows_home="$(wslpath -u "$windows_userprofile")/aicj-wsl-smoke"
          stderr_file="$(mktemp)"
          stdout_file="$(mktemp)"
          set +e
          python3 ~/repo/installer/aicj.py install --home "$windows_home" --dry-run >"$stdout_file" 2>"$stderr_file"
          status=$?
          set -e
          cat "$stdout_file"
          cat "$stderr_file" >&2
          if [ "$status" -ne 0 ]; then
            echo "Windows Python interop is unavailable or the WSL handoff failed on this runner" >&2
            echo "stdout:" >&2
            cat "$stdout_file" >&2
            echo "stderr:" >&2
            cat "$stderr_file" >&2
            exit 1
          fi
          grep -F "已转交" "$stderr_file"
          # .cmd launchers are only generated by Windows Python
          grep -F ".claude/bin/git-safe.cmd" "$stdout_file"
