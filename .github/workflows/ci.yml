name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git identity
        run: |
          git config user.name aicj-ci
          git config user.email aicj-ci@example.invalid
      - run: python -m pytest tests -q -p no:cacheprovider
      - run: python scripts/sanitize_check.py
      - run: python scripts/template_integrity_check.py
      - run: python scripts/install_roundtrip_check.py
